<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MolHub</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { margin-bottom: 0.25rem; }
  h2 { margin-top: 2.5rem; border-top: 1px solid #ddd; padding-top: 1.5rem; }
  .sub { color: #666; margin-top: 0; }
  form { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 200px; padding: 0.5rem; font-family: monospace; }
  input[type=number] { width: 6rem; padding: 0.5rem; }
  button { padding: 0.5rem 1rem; }
  .error { color: #b00020; margin: 0.5rem 0; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  td.smiles { font-family: monospace; }
  .yes { color: #0a7a0a; }
  .no { color: #999; }
  label { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; }
</style>
</head>
<body>

<h1>MolHub</h1>
<p class="sub">Store, filter and search molecules. Swagger docs: <a href="/docs">/docs</a></p>

<form id="add-form">
  <input type="text" id="smiles-input" placeholder="SMILES, e.g. CC(=O)OC1=CC=CC=C1C(=O)O" required>
  <button type="submit">Add molecule</button>
</form>
<div class="error" id="add-error"></div>

<label><input type="checkbox" id="druglike-filter"> Show drug-like (Lipinski) only</label>

<table>
  <thead><tr id="molecules-head"></tr></thead>
  <tbody id="molecules-body"></tbody>
</table>

<h2>Substructure search</h2>
<p class="sub">Find molecules containing a SMARTS pattern, e.g. <code>c1ccccc1</code> (benzene ring).</p>
<form id="substructure-form">
  <input type="text" id="substructure-input" placeholder="SMARTS, e.g. c1ccccc1" required>
  <button type="submit">Search</button>
</form>
<div class="error" id="substructure-error"></div>
<table>
  <thead><tr id="substructure-head"></tr></thead>
  <tbody id="substructure-body"></tbody>
</table>

<h2>Similarity search</h2>
<p class="sub">Rank stored molecules by Tanimoto similarity (Morgan fingerprint) to a query SMILES.</p>
<form id="similarity-form">
  <input type="text" id="similarity-input" placeholder="SMILES, e.g. CC(=O)OC1=CC=CC=C1C(=O)O" required>
  <input type="number" id="similarity-threshold" min="0" max="1" step="0.05" value="0.7" title="Minimum Tanimoto similarity">
  <button type="submit">Search</button>
</form>
<div class="error" id="similarity-error"></div>
<table>
  <thead><tr id="similarity-head"></tr></thead>
  <tbody id="similarity-body"></tbody>
</table>

<script>
const MOLECULE_COLUMNS = [
  ['id', 'ID'], ['smiles', 'SMILES'], ['mw', 'MW'], ['logp', 'LogP'], ['tpsa', 'TPSA'],
  ['h_donors', 'HBD'], ['h_acceptors', 'HBA'], ['ring_count', 'Rings'], ['druglike', 'Drug-like'],
];

function moleculeCell(key, m) {
  if (key === 'smiles') return `<td class="smiles">${m.smiles}</td>`;
  if (key === 'druglike') return `<td class="${m.druglike ? 'yes' : 'no'}">${m.druglike ? 'yes' : 'no'}</td>`;
  return `<td>${m[key]}</td>`;
}

function renderTable(headEl, bodyEl, molecules, extraColumn) {
  const columns = extraColumn ? [...MOLECULE_COLUMNS, extraColumn] : MOLECULE_COLUMNS;
  headEl.innerHTML = columns.map(([, label]) => `<th>${label}</th>`).join('');
  bodyEl.innerHTML = molecules.map(m => {
    const cells = MOLECULE_COLUMNS.map(([key]) => moleculeCell(key, m)).join('');
    const extraCell = extraColumn ? `<td>${m[extraColumn[0]]}</td>` : '';
    return `<tr>${cells}${extraCell}</tr>`;
  }).join('');
}

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

// --- molecules list ---
const addForm = document.getElementById('add-form');
const smilesInput = document.getElementById('smiles-input');
const addError = document.getElementById('add-error');
const moleculesHead = document.getElementById('molecules-head');
const moleculesBody = document.getElementById('molecules-body');
const druglikeFilter = document.getElementById('druglike-filter');

async function loadMolecules() {
  addError.textContent = '';
  const query = druglikeFilter.checked ? '?druglike=true' : '';
  const res = await fetch('/molecules' + query);
  const data = await res.json();
  if (!res.ok) {
    addError.textContent = data.error || data.message || 'Failed to load molecules';
    return;
  }
  renderTable(moleculesHead, moleculesBody, data);
}

addForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  addError.textContent = '';
  try {
    await postJSON('/molecules', { smiles: smilesInput.value.trim() });
    smilesInput.value = '';
    loadMolecules();
  } catch (err) {
    addError.textContent = err.message;
  }
});

druglikeFilter.addEventListener('change', loadMolecules);

// --- substructure search ---
const substructureForm = document.getElementById('substructure-form');
const substructureInput = document.getElementById('substructure-input');
const substructureError = document.getElementById('substructure-error');
const substructureHead = document.getElementById('substructure-head');
const substructureBody = document.getElementById('substructure-body');

substructureForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  substructureError.textContent = '';
  try {
    const results = await postJSON('/search/substructure', { smarts: substructureInput.value.trim() });
    renderTable(substructureHead, substructureBody, results);
  } catch (err) {
    substructureError.textContent = err.message;
    substructureBody.innerHTML = '';
  }
});

// --- similarity search ---
const similarityForm = document.getElementById('similarity-form');
const similarityInput = document.getElementById('similarity-input');
const similarityThreshold = document.getElementById('similarity-threshold');
const similarityError = document.getElementById('similarity-error');
const similarityHead = document.getElementById('similarity-head');
const similarityBody = document.getElementById('similarity-body');

similarityForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  similarityError.textContent = '';
  try {
    const results = await postJSON('/search/similarity', {
      smiles: similarityInput.value.trim(),
      threshold: parseFloat(similarityThreshold.value),
    });
    renderTable(similarityHead, similarityBody, results, ['similarity', 'Similarity']);
  } catch (err) {
    similarityError.textContent = err.message;
    similarityBody.innerHTML = '';
  }
});

loadMolecules();
</script>

</body>
</html>
