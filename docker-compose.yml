services:
  postgres:
    image: iskoldt/postgres16-rdkit:latest
    environment:
      POSTGRES_USER: molhub
      POSTGRES_PASSWORD: molhub
      POSTGRES_DB: molhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molhub -d molhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  chem-python:
    build: ./chem-python
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  chem-service:
    build: ./chem-service
    environment:
      DATABASE_URL: postgres://molhub:molhub@postgres:5432/molhub
      CHEM_PYTHON_URL: http://chem-python:8000
      ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      chem-python:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    environment:
      PORT: "3000"
      CHEM_SERVICE_URL: http://chem-service:8080
    ports:
      - "3000:3000"
    depends_on:
      - chem-service

volumes:
  pgdata:
